name: Deploy SubBoost-Edge to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'edge/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮一键部署
  schedule:
    - cron: '0 0 * * 1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # 将 npm ci 改为 npm install，避免 lockfile 严格检查阻断
        run: npm install

      - name: Typecheck and Build
        run: |
          npm run edge:typecheck
          npm run edge:build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run edge:deploy

      - name: Set Secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGE_ADMIN_PASSWORD: ${{ secrets.EDGE_ADMIN_PASSWORD }}
          EDGE_SESSION_SECRET: ${{ secrets.EDGE_SESSION_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$EDGE_ADMIN_PASSWORD" | npx wrangler secret put EDGE_ADMIN_PASSWORD --config edge/wrangler.jsonc
          printf '%s' "$EDGE_SESSION_SECRET" | npx wrangler secret put EDGE_SESSION_SECRET --config edge/wrangler.jsonc
          if [ -n "$GITHUB_TOKEN" ]; then
            printf '%s' "$GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config edge/wrangler.jsonc
          fi
