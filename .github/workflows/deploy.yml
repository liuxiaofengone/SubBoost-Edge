name: Deploy SubBoost-Edge to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'edge/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮一键部署
  schedule:
    # 每周一上午 8:00 (UTC 0:00) 自动触发一次构建（可选）
    - cron: '0 0 * * 1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: |
          npm run edge:typecheck
          npm run edge:build

      - name: Set Secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.EDGE_ADMIN_PASSWORD }}" | npx wrangler secret put EDGE_ADMIN_PASSWORD --config edge/wrangler.jsonc
          echo "${{ secrets.EDGE_SESSION_SECRET }}" | npx wrangler secret put EDGE_SESSION_SECRET --config edge/wrangler.jsonc
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | npx wrangler secret put GITHUB_TOKEN --config edge/wrangler.jsonc
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run edge:deploy
